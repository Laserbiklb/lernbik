# One-time: delete the old group "vhs-lueneburg" again. Delete this workflow afterwards.
name: Close old VHS Lüneburg (once)
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix tools --no-audit --no-fund
      - run: node tools/close_old_once.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
