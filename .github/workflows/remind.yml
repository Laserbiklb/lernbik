# Reminders (homework, words to review): every 30 minutes, sends a push to everyone whose reminder
# time has come. GitHub starts scheduled runs late or skips some (fewer at odd minutes), so the
# script also sends reminders that are up to 3 hours late.
name: Reminders

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix tools --no-audit --no-fund
      - run: node tools/remind.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
