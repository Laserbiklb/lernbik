# Homework reminders: every 30 minutes, sends a push to everyone whose reminder time it is
# and who still has open homework. GitHub may start scheduled runs a few minutes late.
name: Reminders

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix tools --no-audit --no-fund
      - run: node tools/remind.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
