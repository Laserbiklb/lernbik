# One-time: move everyone into "VHS 277" and delete the other groups (run "dry" first, then "apply").
# Delete this workflow afterwards.
name: Move into VHS 277 (once)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = only show, apply = do it"
        required: true
        default: dry
        type: choice
        options: [dry, apply]

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix tools --no-audit --no-fund
      - run: node tools/move_once.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          MODE: ${{ inputs.mode }}
