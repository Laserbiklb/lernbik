# Builds and publishes Lernbik.
#  - Web version and Wortkreis → Firebase Hosting (https://lernbik.web.app) on every push.
#  - Android APK → GitHub Release, only when the app code changes (or when started by hand),
#    so content updates never ask people to install a new APK.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apk:
        description: "Build a new APK"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.f.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: f
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "app=${{ inputs.apk }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^(lib/|android/|pubspec\.)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif ! gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  apk:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::Secret ANDROID_KEYSTORE is missing"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > android/app/lernbik.jks
          printf 'storeFile=lernbik.jks\nstorePassword=%s\nkeyAlias=lernbik\nkeyPassword=%s\n' "$KEYPASS" "$KEYPASS" > android/key.properties
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm,android-arm64 --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk lernbik.apk
          gh release create "v1.0.${{ github.run_number }}" lernbik.apk --title "Lernbik 1.0.${{ github.run_number }}" --notes "Android" --latest

  web:
    needs: [changes, apk]
    if: always() && needs.changes.result == 'success' && (needs.apk.result == 'success' || needs.apk.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Wortkreis page
        run: python3 tools/wrap_wortkreis.py
      - name: Build web
        run: flutter build web --release
      - name: version.json (latest APK build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || echo v1.0.0)
          echo "{\"build\": ${tag##*.}}" > build/web/version.json
          cat build/web/version.json
      - name: Deploy to Firebase (hosting + database rules)
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then echo "::error::Secret FIREBASE_SA is missing"; exit 1; fi
          echo "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@14 deploy --only hosting,firestore:rules --project lernbik --non-interactive
