<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Wortkreis</title>

<style>
/* Layout: one narrow column like a road-sign post. The word always sits on a yellow
   Ortsschild; der / die / das keep the textbook colours blue / red / green everywhere. */
:root{
  --bg:#E8ECF0; --panel:#F8FAFB; --ink:#16202B; --muted:#566373; --line:#C7D0D9;
  --accent:#1B4F9C; --accent-ink:#FFFFFF;
  --sign:#F6CF1B; --sign-ink:#121212;
  --der:#1F5FBF; --die:#C5332C; --das:#1D8448; --on-art:#FFFFFF;
  --der-t:#1F5FBF; --die-t:#B92D26; --das-t:#197A41;
  --ok:#197A41; --bad:#B92D26; --ok-bg:#DCEFE3; --bad-bg:#F6DEDC;
  --cn:#1F5FB8; --cn-bg:#E3ECF8; --ca:#B8322A; --ca-bg:#F8E4E1; --cd:#1E7D45; --cd-bg:#DFF1E6;
  --display:"Sofia Sans Semi Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Sofia Sans","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12181F; --panel:#1C242D; --ink:#E8EDF2; --muted:#96A3B1; --line:#34414E;
  --accent:#6BA2EE; --accent-ink:#0B1420;
  --der-t:#82B2F6; --die-t:#F0908A; --das-t:#72D09A;
  --ok:#72D09A; --bad:#F0908A; --ok-bg:#1B3A2A; --bad-bg:#45211F; --cn:#7FB0F5; --cn-bg:#16273F; --ca:#F29A92; --ca-bg:#3E1D1A; --cd:#7DD6A0; --cd-bg:#15321F; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12181F; --panel:#1C242D; --ink:#E8EDF2; --muted:#96A3B1; --line:#34414E;
  --accent:#6BA2EE; --accent-ink:#0B1420;
  --der-t:#82B2F6; --die-t:#F0908A; --das-t:#72D09A;
  --ok:#72D09A; --bad:#F0908A; --ok-bg:#1B3A2A; --bad-bg:#45211F; --cn:#7FB0F5; --cn-bg:#16273F; --ca:#F29A92; --ca-bg:#3E1D1A; --cd:#7DD6A0; --cd-bg:#15321F; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body)}
.app{max-width:560px;margin:0 auto;padding-block:18px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:1.15rem;font-weight:700}
.muted{color:var(--muted)}
.t-der{color:var(--der-t)} .t-die{color:var(--die-t)} .t-das{color:var(--das-t)}

.brand{display:flex;align-items:center;gap:10px}

.lvsw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.top .topr{flex-basis:100%}
.chips.chs .chip b{font-weight:800;margin-right:4px;opacity:.6}

.score{display:flex;gap:14px;font:600 .95rem var(--display);font-variant-numeric:tabular-nums}

#view{display:flex;flex-direction:column;gap:18px}
.block{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.learnb.on{background:var(--ok-bg,#dff1e6);border-color:var(--ok,#1e7d45);color:var(--ok,#1e7d45)}
details.bch.alldone .bn{background:var(--ok,#1e7d45);color:#fff}
a.trl{font-size:.8rem;font-weight:600;color:var(--accent,#2f6fdb);text-decoration:none;white-space:nowrap;margin-left:4px}

.repbox{display:flex;flex-direction:column;gap:8px;margin-top:8px}.repbox textarea{width:100%;min-height:70px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;padding:8px}

.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:4px}

.chl{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}

details{border:1.5px solid var(--line);border-radius:12px;background:var(--panel)}
summary{padding:12px 14px;font:700 1.05rem var(--display);cursor:pointer}
.dbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
label{font:600 .9rem var(--display);color:var(--muted);display:flex;flex-direction:column;gap:4px}

.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font:400 1rem var(--body)}
.chlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

.note{font-size:.92rem;padding:8px 10px;border-radius:8px;background:var(--ok-bg);color:var(--ok)}
.note.warn{background:var(--bad-bg);color:var(--bad)}
code{font-family:ui-monospace,Consolas,monospace;font-size:.9em}

.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.tab{border:0;background:transparent;padding:10px 4px;font:700 1.05rem var(--display);min-width:0}
@media (max-width:440px){.tab{font-size:.88rem;padding:10px 2px}}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.rules,.prev{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--line)}
.rules li,.prev li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:11px 0;border-bottom:1.5px solid var(--line)}
.rules .what,.prev .w{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}
.rules .what b{display:block;font:700 1.05rem var(--display)}
.rules .what span{font-size:.9rem}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:14px}

.ask p{margin:10px 0 0;text-align:left}
.toks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.tok.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

.combo{font:700 .85rem var(--display);background:var(--sign);color:var(--sign-ink);border-radius:999px;padding:2px 9px;white-space:nowrap}
.go.alt{background:var(--sign);color:var(--sign-ink);font-size:1.15rem;padding:13px}
.tbar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.tbar span{display:block;height:100%;background:var(--accent)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toks.sm .tok{padding:8px 0;min-width:40px;text-align:center}
.between{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fbtn{display:flex;gap:8px}

/* round */
.rbar{display:flex;align-items:center;gap:12px}
.x{border:1.5px solid var(--line);background:transparent;border-radius:8px;width:38px;height:38px;font-size:1.2rem;line-height:1}
.pips{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex:1}
.pips li{flex:1;height:8px;border-radius:4px;background:var(--line)}
.pips li.done{background:var(--ink)} .pips li.cur{background:var(--accent)}
.cnt{font:700 1rem var(--display);font-variant-numeric:tabular-nums;color:var(--muted)}
.stage{font:700 .85rem var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sign{background:var(--sign);color:var(--sign-ink);border-radius:14px;padding:6px}
.sign-in{border:3px solid var(--sign-ink);border-radius:9px;padding:24px 14px 14px;text-align:center}
.sign-word{font:800 clamp(2rem,10vw,3.3rem)/1.05 var(--display);overflow-wrap:anywhere}
.sign-sub{border-top:3px solid var(--sign-ink);margin-top:16px;padding-top:8px;font:600 1.05rem var(--display);overflow-wrap:anywhere}
.ask{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:22px 14px;text-align:center}
.ask b{font:800 clamp(1.6rem,8vw,2.4rem)/1.1 var(--display);display:block;overflow-wrap:anywhere}
.ask span{color:var(--muted);font-size:.92rem}
.arts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.art{border:0;border-radius:12px;padding:16px 4px 10px;color:var(--on-art);font:800 1.6rem var(--display);display:flex;flex-direction:column;align-items:center;gap:2px}

.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.pair{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px 8px;min-height:54px;min-width:0;overflow-wrap:anywhere;font-size:1rem}
.pair.de{font:700 1.05rem var(--display)}
.pair.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.pair:disabled{cursor:default}
.type{display:flex;flex-direction:column;gap:10px}
.type input{font:700 1.3rem var(--display);padding:13px 12px;text-align:center}
.uml{display:flex;gap:8px;justify-content:center}
.uml button{width:46px;height:40px;border:1.5px solid var(--line);background:var(--panel);border-radius:8px;font:700 1.1rem var(--display)}
.fb{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fb p{margin:0;font-size:1.05rem}
.fb .yes{color:var(--ok);font-weight:700} .fb .no{color:var(--bad);font-weight:700}
.res{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--line)}
.res li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1.5px solid var(--line)}
.res .w{flex:1;min-width:0;overflow-wrap:anywhere}

.lv{display:flex;gap:3px}

.lv i.on{background:var(--das)}
.mark{font-weight:700;width:1.2em;text-align:center}
.big{font:800 2rem var(--display)}
footer{font-size:.85rem;color:var(--muted);text-align:center}
.gap{display:inline-block;min-width:2.5em;border-bottom:3px solid var(--accent);color:var(--accent)}
u.ok{text-decoration:none;border-bottom:3px solid var(--ok);color:var(--ok)}
.sheet{display:flex;flex-direction:column;gap:8px}

.sheet table{border-collapse:collapse;font-size:.92rem;min-width:100%}
.sheet th,.sheet td{border:1px solid var(--line);padding:5px 7px;text-align:left;white-space:nowrap}
.sheet th{background:var(--bg);font:700 .9rem var(--display)}
.tw{overflow-x:auto;max-width:100%}
.sl{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.ask .sent u,.ask .sent .gap{font:inherit}
p.yes{color:var(--ok);font-weight:600} p.no{color:var(--bad);font-weight:600}
.q1{margin:0;font-size:1.02rem}
.dq{width:100%;font-size:1.05rem;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
.dict{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dict .dl{font:800 1rem var(--display);color:var(--muted);padding:12px 0 4px}
.dict .dw{display:grid;grid-template-columns:10px minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.dict .lvd{width:10px;height:10px;border-radius:50%} .dict .dde{overflow-wrap:anywhere} .dict .dde b{font-weight:700} .dict .dru{color:var(--muted);overflow-wrap:anywhere}

.intro{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.intro .iw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.intro .iword{font:700 1.25rem var(--display);overflow-wrap:anywhere} .intro .iword b{font:inherit} .intro .ir{color:var(--muted)}
@media (max-width:440px){.intro .iw{grid-template-columns:minmax(0,1fr) auto}.intro .ir{grid-column:1;grid-row:2}}
.refl{display:flex;flex-direction:column;gap:10px}
.rsec{display:flex;flex-wrap:wrap;gap:6px}
.blist{display:flex;flex-direction:column;gap:8px;margin-top:12px}

.bn{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font:700 1rem var(--display)}

.rsb{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 13px 7px 7px;font:700 .95rem var(--display);cursor:pointer}
.rsb span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:.8rem}
.rsb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)} .rsb.on span{background:var(--bg);color:var(--ink)}
details.ref summary{display:flex;gap:10px;align-items:center;list-style:none} details.ref summary::-webkit-details-marker{display:none}
details.ref summary::after{content:"›";margin-left:auto;font-size:1.4rem;color:var(--muted);transition:transform .15s} details.ref[open] summary::after{transform:rotate(90deg)}

function str(v,n){return typeof v==="string"?v.trim().slice(0,n):"";}
function bare(s){return s.replace(/^[^A-Za-z0-9äöüÄÖÜß]+|[^A-Za-z0-9äöüÄÖÜß]+$/g,"");}
function validTask(t){
  if(!t||typeof t!=="object")return {e:"это не объект"};
  var why=str(t.why,300),ty=str(t.type,12).toLowerCase();
  if(ty==="gap"){
    var text=str(t.text,200).replace(/_{2,}/,"___"),ans=str(t.answer,40);
    var opts=Array.isArray(t.options)?t.options.map(function(o){return str(o,40);}).filter(Boolean):[];
    opts=opts.filter(function(o,i){return opts.indexOf(o)===i;}).slice(0,5);
    if(text.indexOf("___")<0)return {e:"в text нет пропуска ___"};
    if(opts.length<2)return {e:"в options нужно хотя бы два варианта"};
    if(opts.indexOf(ans)<0)return {e:"ответа «"+ans+"» нет среди options"};
    return {t:{type:"gap",text:text,options:opts,answer:ans,why:why}};
  }
  if(ty==="order"){
    var w=Array.isArray(t.words)?t.words:(typeof t.answer==="string"?t.answer.split(/\s+/):[]);
    w=w.map(function(x){return str(x,30);}).filter(Boolean);
    if(w.length<3||w.length>14)return {e:"в words должно быть от 3 до 14 слов"};
    return {t:{type:"order",words:w,why:why}};
  }
  if(ty==="error"){
    var tx=str(t.text,200),wr=str(t.wrong,40),ri=str(t.right,60);
    if(!tx||!wr||!ri)return {e:"нужны поля text, wrong и right"};
    if(/\s/.test(wr))return {e:"wrong должно быть одним словом"};
    if(!tx.split(/\s+/).some(function(x){return bare(x)===bare(wr);}))return {e:"слова «"+wr+"» нет в text"};
    return {t:{type:"error",text:tx,wrong:wr,right:ri,why:why}};
  }
  if(ty==="write"){
    var task=str(t.task,240),a=(Array.isArray(t.answer)?t.answer:[t.answer]).map(function(x){return str(x,160);}).filter(Boolean).slice(0,6);
    if(!task||!a.length)return {e:"нужны поля task и answer"};
    return {t:{type:"write",task:task,answer:a,why:why}};
  }
  return {e:"неизвестный type «"+ty+"»"};
}
function newId(){return "r"+Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36);}
function validRule(o){
  var out={id:str(o.id,24)||newId(),rule:str(o.rule||o.title||o.name,80)||"Правило без названия",chapter:str(o.chapter,40),explain:str(o.explain,700),tasks:[]},errs=[];
  (Array.isArray(o.tasks)?o.tasks:[]).slice(0,60).forEach(function(t,i){var v=validTask(t);if(v.t)out.tasks.push(v.t);else errs.push("задание "+(i+1)+": "+v.e);});
  return {r:out,errs:errs};
}
function parseImport(txt){
  var a=txt.search(/[\[{]/),b=Math.max(txt.lastIndexOf("}"),txt.lastIndexOf("]"));
  if(a<0||b<=a)return {err:"В тексте нет JSON. Вставьте ответ нейросети целиком, от первой фигурной скобки до последней."};
  var o;try{o=JSON.parse(txt.slice(a,b+1));}catch(e){return {err:"JSON повреждён ("+e.message+"). Попросите нейросеть повторить ответ строго в формате JSON."};}
  var arr=Array.isArray(o)?o:[o];
  if(arr.length&&arr[0]&&arr[0].type&&!arr[0].tasks)arr=[{tasks:arr}];
  var rules=[],errs=[];
  arr.slice(0,10).forEach(function(x){
    if(!x||typeof x!=="object")return;
    var v=validRule({rule:x.rule,title:x.title,name:x.name,chapter:x.chapter,explain:x.explain,tasks:x.tasks});
    errs=errs.concat(v.errs);if(v.r.tasks.length)rules.push(v.r);
  });
  if(!rules.length)return {err:"В ответе нет ни одного пригодного задания"+(errs.length?": "+errs.slice(0,3).join("; "):"")+"."};

function startBlitz(){

  B={end:Date.now()+60000,score:0,combo:0,max:0,right:0,n:0,cur:null,miss:[],last:'<span class="muted">Совпадает ли надпись на табличке? Клавиши ← и →.</span>',p:p,all:STARTER.concat(custom())};

function tick(){
  if(!B)return;
  var left=B.end-Date.now();
  if(left<=0)return finishBlitz();
  var el=document.getElementById("btime"),bar=document.getElementById("bbar");
  if(el)el.textContent=Math.ceil(left/1000);
  if(bar)bar.style.width=(left/600)+"%";
}
function mult(){return B.combo>=10?3:B.combo>=5?2:1;}
function blitzQ(){
  var w;do{w=B.p[Math.floor(Math.random()*B.p.length)];}while(B.cur&&w.k===B.cur.w.k);
  var truth=Math.random()<0.5,main,sub;
  if(w.a&&Math.random()<0.5){
    main=(truth?w.a:shuffle(["der","die","das"].filter(function(x){return x!==w.a;}))[0])+" "+w.d;sub=w.r;
  }else{
    sub=w.r;
    if(!truth){var o=shuffle(B.all.filter(function(x){return x.r!==w.r;}))[0];if(o)sub=o.r;else truth=true;}
    main=w.k;
  }
  B.cur={w:w,truth:truth};
  var left=Math.max(0,B.end-Date.now());
  view.innerHTML='<div class="rbar"><button class="x" data-act="quit" aria-label="Выйти на главную">×</button><div class="tbar"><span id="bbar" style="width:'+(left/600)+'%"></span></div><span class="cnt" id="btime">'+Math.ceil(left/1000)+"</span></div>"+
    '<div class="between"><span class="stage">Блиц · верно или нет?</span><span class="stage">очки '+B.score+(mult()>1?" · ×"+mult():"")+"</span></div>"+
    sign(esc(main),esc(sub))+
    '<div class="tf"><button class="art die" data-act="bno">Falsch<small>←</small></button><button class="art das" data-act="byes">Richtig<small>→</small></button></div>'+
    '<div class="fb" aria-live="polite"><p>'+B.last+"</p></div>";
}
function blitzAns(v){

  {t:"Akkusativ: den / einen",ex:"Ich brauche einen Tisch.",b:rp("После глаголов <i>haben, brauchen, kaufen, suchen, sehen</i> идёт Akkusativ (кого? что?). Меняется <b>только мужской род</b>: der → <b>den</b>, ein → <b>einen</b>.")+tb2([["Nom","der / ein","die / eine","das / ein"],["Akk","<b>den / einen</b>","die / eine","das / ein"]],["","m","f","n"]),tr:[["cases","akk"],["cases","role","Кто / кого / кому"]]},
  {t:"Отрицание kein",ex:"Ich habe kein Sofa. · keinen Balkon",b:rp("<b>kein</b> = «нет, ни одного» перед существительным. Склоняется как ein: kein, keine, kein; в Akkusativ m — <b>keinen</b>; во мн. ч. — <b>keine</b>. <b>nicht</b> — перед прилагательным и глаголом.")+rx(["Das ist kein Stuhl.","Wir haben keinen Fernseher.","Die Wohnung ist nicht teuer."])},
  {t:"der → er, die → sie, das → es",ex:"Der Tisch ist neu. Er ist schön.",b:rp("Местоимение повторяет род слова, а не «живой/неживой»: der Tisch → <b>er</b>, die Lampe → <b>sie</b>, das Bett → <b>es</b>, мн. → <b>sie</b>.")+rx(["Wie findest du die Küche? — <b>Sie</b> ist toll."])}]},
 {n:4,t:"Familienleben",r:[
  {t:"Possessivartikel: mein, dein, sein …",ex:"mein Bruder · meine Schwester",b:tb2([["ich","mein"],["du","dein"],["er / es","sein"],["sie","ihr"],["wir","unser"],["ihr","euer"],["sie / Sie","ihr / Ihr"]],["кто","чей"])+rp("Окончание как у <b>ein</b>: mein Vater, mein<b>e</b> Mutter, mein Kind, mein<b>e</b> Eltern; Akk m: mein<b>en</b> Bruder.")},
  {t:"Порядок: zuerst, dann, danach",ex:"Zuerst frühstücken wir, dann …",b:rp("Если предложение начинается с <b>zuerst, dann, danach, am Montag</b>, глагол всё равно на 2-м месте, а подлежащее идёт <b>после</b> глагола.")+rx(["Zuerst <b>kaufen</b> wir ein.","Danach <b>gehen</b> wir ins Kino."]),tr:[["verbs","ord"]]},
  {t:"Глаголы со сменой гласной",ex:"lesen → er liest · fahren → er fährt",b:rp("Меняется только у <b>du</b> и <b>er/sie/es</b>.")+tb2([["e → i","sprechen, essen, nehmen","du sprichst, er isst, er nimmt"],["e → ie","lesen, sehen","du liest, er sieht"],["a → ä","fahren, schlafen","du fährst, er schläft"]])},
  {t:"Präteritum: war, hatte",ex:"Ich war in Berlin. · Ich hatte Zeit.",b:rp("Для <b>sein</b> и <b>haben</b> о прошлом обычно говорят так:")+tb2([["ich","war","hatte"],["du","warst","hattest"],["er/sie","war","hatte"],["wir","waren","hatten"],["ihr","wart","hattet"],["sie/Sie","waren","hatten"]],["","sein","haben"])}]},
 {n:5,t:"Der Tag und die Woche",r:[
  {t:"Отделяемые глаголы",ex:"aufstehen → Ich stehe um 7 auf.",b:rp("Приставка (<i>auf, an, ein, mit, fern…</i>) отрывается и уходит в <b>конец</b> предложения.")+rx(["Ich <b>stehe</b> um sieben <b>auf</b>.","<b>Rufst</b> du mich <b>an</b>?"]),tr:[["verbs","sep"]]},
  {t:"gehen + инфинитив",ex:"Wir gehen einkaufen.",b:rp("<b>gehen</b> спрягается, второй глагол — в конце без изменений.")+rx(["Ich gehe heute schwimmen.","Gehst du mit spazieren?"])},
  {t:"Время в предложении",ex:"Am Montag spiele ich Fußball.",b:rp("Время можно поставить первым — глагол остаётся вторым. Порядок в середине: <b>когда → как → куда</b>.")+rx(["Ich gehe am Montag zum Arzt.","Am Montag gehe ich zum Arzt."]),tr:[["verbs","ord"]]},
  {t:"um, am, von … bis",ex:"um 8 Uhr · am Montag · von 9 bis 12",b:tb2([["um","точное время","um halb acht"],["am","день, часть дня","am Freitag, am Abend"],["von … bis","от … до","von 9 bis 12 Uhr"],["ab","начиная с","ab 8 Uhr"]]),tr:[["verbs","time"]]}]},
 {n:6,t:"Guten Appetit!",r:[
  {t:"Imperativ",ex:"Komm! · Kommt! · Kommen Sie!",b:tb2([["du","Komm! Nimm! Lies!"],["ihr","Kommt! Nehmt!"],["Sie","Kommen Sie! Nehmen Sie!"]])+rp("У <b>du</b> окончание -st и «du» убираются: du nimmst → <b>Nimm!</b> Вежливо добавляют <i>bitte</i>."),tr:[["verbs","pol"]]},
  {t:"möchten и mögen",ex:"Ich möchte Kaffee. · Ich mag Kaffee.",b:rp("<b>möchten</b> — хочу сейчас (вежливо). <b>mögen</b> — люблю вообще.")+tb2([["ich","möchte","mag"],["du","möchtest","magst"],["er/sie","möchte","mag"],["wir","möchten","mögen"]],["","möchten","mögen"])},
  {t:"gern / nicht gern / lieber",ex:"Ich esse gern Fisch.",b:rp("<b>gern</b> ставится после глагола: «делаю охотно». Не нравится — <b>nicht gern</b>.")+rx(["Ich trinke gern Tee.","Er isst nicht gern Fleisch."])},
  {t:"man",ex:"In Deutschland isst man …",b:rp("<b>man</b> = «люди, все» (как русское безличное «едят, говорят»). Глагол как у er: man isst, man trinkt.")}]},
 {n:7,t:"Arbeit und Beruf",r:[
  {t:"Модальные: können, müssen, wollen",ex:"Ich muss heute arbeiten.",b:rp("Модальный глагол — на 2-м месте, второй глагол — <b>в конце</b> в инфинитиве (рамка).")+tb2([["ich","kann","muss","will"],["du","kannst","musst","willst"],["er/sie","kann","muss","will"],["wir","können","müssen","wollen"]],["","können","müssen","wollen"])+rx(["Ich <b>kann</b> gut Deutsch <b>sprechen</b>."])},
  {t:"Dativ: артикль",ex:"mit dem Bus · mit der Kollegin",b:tb2([["Nom","der / ein","die / eine","das / ein","die"],["Dat","<b>dem / einem</b>","<b>der / einer</b>","<b>dem / einem</b>","<b>den</b> + -n"]],["","m","f","n","мн."]),tr:[["cases","dat"]]},
  {t:"Предлоги с Dativ: aus, bei, mit, nach, von, zu",ex:"zum Arzt · beim Chef · vom Büro",b:CEXP.pdat,tr:[["cases","pdat"],["cases","zus","Слияния zum, zur"]]}]},
 {n:8,t:"Gute Besserung!",r:[
  {t:"Модальный sollen",ex:"Sie sollen viel trinken.",b:rp("<b>sollen</b> — «должен, потому что кто-то так сказал» (врач, начальник). ich soll, du sollst, er soll, wir sollen.")+rx(["Der Arzt sagt, ich <b>soll</b> im Bett <b>bleiben</b>."])},
  {t:"Местоимения в Akkusativ",ex:"Ich rufe dich an. · Er besucht uns.",b:tb2([["ich","mich"],["du","dich"],["er","ihn"],["sie","sie"],["es","es"],["wir","uns"],["ihr","euch"],["sie / Sie","sie / Sie"]],["Nom","Akk"]),tr:[["cases","pron"]]}]},
 {n:9,t:"Wege durch die Stadt",r:[
  {t:"mit + Dativ: транспорт",ex:"mit dem Bus · mit der U-Bahn · zu Fuß",b:rp("На чём едем — <b>mit + Dativ</b>. Пешком — <b>zu Fuß</b>.")+rx(["Ich fahre mit dem Fahrrad.","Sie fährt mit der Straßenbahn."]),tr:[["cases","pdat"]]},
  {t:"Wo? → Dativ: in, an, auf, über, unter …",ex:"Das Café ist neben der Bank.",b:CEXP.wowo,tr:[["cases","wowo"]]},
  {t:"Модальный dürfen",ex:"Hier darf man nicht parken.",b:rp("<b>dürfen</b> — «можно, разрешено». <b>nicht dürfen</b> — «нельзя». ich darf, du darfst, er darf, wir dürfen.")}]},
 {n:10,t:"Mein Leben",r:[
  {t:"Perfekt: haben или sein",ex:"Ich habe gearbeitet. · Ich bin gefahren.",b:rp("Perfekt = <b>haben/sein</b> (2-е место) + <b>Partizip II</b> (в конце). <b>sein</b> — при движении (fahren, gehen, kommen), изменении состояния (aufwachen, einschlafen) и у bleiben, sein. Остальные — <b>haben</b>.")+rx(["Ich <b>habe</b> gestern Pizza <b>gegessen</b>.","Wir <b>sind</b> nach Hamburg <b>gefahren</b>."])},
  {t:"Partizip II: ge-…-t / ge-…-en",ex:"machen → gemacht · aufräumen → aufgeräumt",b:tb2([["правильные","ge- … -t","machen → <b>ge</b>mach<b>t</b>"],["неправильные","ge- … -en","sehen → <b>ge</b>seh<b>en</b>"],["отделяемые","ge в середине","einkaufen → ein<b>ge</b>kauft"]]),tr:[["verbs","sep"]]},
  {t:"seit + Dativ",ex:"seit einem Jahr · seit drei Monaten",b:rp("<b>seit</b> — «уже (и продолжается сейчас)». Глагол в настоящем времени!")+rx(["Ich wohne <b>seit</b> einem Jahr hier.","Er lernt <b>seit</b> zwei Monaten Deutsch."])}]},
 {n:11,t:"Ämter und Behörden",r:[
  {t:"Местоимения в Dativ",ex:"Kannst du mir helfen?",b:tb2([["ich","mich","mir"],["du","dich","dir"],["er","ihn","ihm"],["sie","sie","ihr"],["wir","uns","uns"],["ihr","euch","euch"],["sie / Sie","sie / Sie","ihnen / Ihnen"]],["Nom","Akk","Dat"])+rp("Dativ после <b>helfen, danken, gehören, gefallen</b>: Das gehört <b>mir</b>."),tr:[["cases","pron"]]},
  {t:"Дата: der erste, am ersten",ex:"Heute ist der 3. Mai. · am 3. Mai",b:rp("Порядковые: 1–19 → <b>-te</b> (zwei<b>te</b>), с 20 → <b>-ste</b> (zwanzig<b>ste</b>). Исключения: <b>erste, dritte, siebte</b>.")+rx(["Heute ist der zweit<b>e</b> Juni.","Ich habe <b>am</b> zweit<b>en</b> Juni Geburtstag."])},
  {t:"für + Akkusativ",ex:"für meinen Sohn · für dich",b:rp("После <b>für</b> всегда Akkusativ.")+rx(["Das Formular ist für meinen Mann.","Ist das für mich?"]),tr:[["cases","pakk"]]}]},
 {n:12,t:"Im Kaufhaus",r:[
  {t:"Прилагательное: после глагола и перед словом",ex:"Der Mantel ist blau. · der blaue Mantel",b:rp("После <b>sein</b> прилагательное без окончания. Перед существительным — с окончанием. После <b>der/die/das</b> почти всегда <b>-e</b>, а в Akk m и во мн. ч. — <b>-en</b>.")+tb2([["Nom","der blau<b>e</b> Mantel","die rot<b>e</b> Jacke","das neu<b>e</b> Hemd","die schwarz<b>en</b> Schuhe"],["Akk","den blau<b>en</b> Mantel","die rot<b>e</b> Jacke","das neu<b>e</b> Hemd","die schwarz<b>en</b> Schuhe"]],["","m","f","n","мн."]),tr:[["adj","d","Тренажёр окончаний"]]},
  {t:"welch-?",ex:"Welcher Rock? — Der blaue.",b:rp("<b>welcher, welche, welches</b> — «какой (из этих)?». Окончание как у der/die/das.")+rx(["Welche Jacke nimmst du?","Welchen Pullover möchten Sie?"])},
  {t:"Komposita",ex:"der Kühlschrank = kühl + der Schrank",b:rp("Сложное слово берёт артикль <b>последней</b> части: die Hand + <b>die</b> Tasche = <b>die</b> Handtasche; das Kinder + <b>der</b> Garten = <b>der</b> Kindergarten.")}]},
 {n:13,t:"Auf Reisen",r:[
  {t:"es: es regnet, es gibt",ex:"Es ist kalt. · Es gibt einen Park.",b:rp("<b>es</b> без смысла нужен для погоды, времени и выражения <b>es gibt</b> (+ Akk) «есть, имеется».")+rx(["Es schneit.","Es ist acht Uhr.","Hier gibt es einen Bahnhof."])},
  {t:"для, вокруг, через: für, um, durch",ex:"durch den Park · um den See",b:CEXP.pakk,tr:[["cases","pakk"]]},
  {t:"Komparativ: größer als, so … wie",ex:"Berlin ist größer als Hamburg.",b:rp("Сравнение: прилагательное + <b>-er</b> + <b>als</b>. Одинаково: <b>genauso … wie</b>. Короткие часто с умлаутом.")+tb2([["groß","größer"],["alt","älter"],["gut","<b>besser</b>"],["viel","<b>mehr</b>"],["gern","<b>lieber</b>"]])+rx(["Der Zug ist schneller <b>als</b> der Bus.","Heute ist es genauso warm <b>wie</b> gestern."])}]},
 {n:14,t:"Zusammen leben",r:[
  {t:"aber, denn, und, oder",ex:"Ich komme nicht, denn ich bin krank.",b:rp("Эти союзы <b>не меняют</b> порядок слов: после них глагол на 2-м месте, как обычно. Сравните: <b>weil</b> отправляет глагол в конец (A2, гл. 2).")+rx(["Ich komme, <b>aber</b> ich habe wenig Zeit.","Ich bleibe zu Hause, <b>denn</b> es regnet."]),tr:[["verbs","ord"]]}]}
],
A2:[
 {n:1,t:"Meine Geschichte",r:[
  {t:"Perfekt (повторение)",ex:"Ich bin 2022 nach Deutschland gekommen.",b:rp("haben/sein на 2-м месте + Partizip II в конце. sein — движение и изменение состояния. Подробно — A1, гл. 10.")+rx(["Ich <b>habe</b> in Kiew <b>studiert</b>.","Ich <b>bin</b> nach Deutschland <b>gekommen</b>."])},
  {t:"Partizip без ge-",ex:"studieren → studiert · verlassen → verlassen",b:rp("Без <b>ge-</b>: глаголы на <b>-ieren</b> и с неотделяемыми приставками <b>be-, ver-, er-, ent-, ge-, emp-, zer-</b>.")+rx(["Ich habe Deutsch <b>studiert</b>.","Er hat sein Land <b>verlassen</b>.","Ich habe viel <b>erlebt</b>."])},
  {t:"Possessivartikel (повторение)",ex:"mit meinem Bruder · für meine Familie",b:rp("Окончания как у <b>ein</b>: Akk m — mein<b>en</b>, Dat — mein<b>em</b> / mein<b>er</b>, мн. Dat — mein<b>en</b> + -n.")+rx(["Ich wohne bei mein<b>er</b> Tante.","Ich spreche mit mein<b>em</b> Bruder."])}]},
 {n:2,t:"Medien",r:[
  {t:"Nebensätze mit weil",ex:"…, weil ich keine Zeit habe.",b:rp("<b>weil</b> = «потому что». В придаточном спрягаемый глагол уходит <b>в конец</b>. Перед weil — запятая.")+rx(["Ich lese E-Books, <b>weil</b> sie leicht <b>sind</b>.","Warum chattest du? — <b>Weil</b> es schnell <b>geht</b>."]),tr:[["verbs","ord"]]},
  {t:"Nebensätze mit dass",ex:"Ich finde, dass Fernsehen langweilig ist.",b:rp("<b>dass</b> = «что» после <i>ich finde, ich denke, ich glaube, es ist wichtig</i>. Глагол — <b>в конец</b>.")+rx(["Ich denke, <b>dass</b> das Internet nützlich <b>ist</b>."]),tr:[["verbs","ord"]]}]},
 {n:3,t:"Wochenende",r:[
  {t:"Wechselpräpositionen: Wo? / Wohin?",ex:"im Park (Dat) · in den Park (Akk)",b:CEXP.wowo,tr:[["cases","wowo"]]},
  {t:"ja, nein, doch",ex:"Hast du keine Zeit? — Doch!",b:rp("На вопрос с <b>nicht/kein</b> ответ «нет, как раз да» — <b>doch</b>.")+tb2([["Hast du Zeit?","Ja. / Nein."],["Hast du keine Zeit?","<b>Doch</b>, ich habe Zeit. / Nein, keine."]])}]},
 {n:4,t:"Schule",r:[
  {t:"Nebensätze mit wenn",ex:"Wenn ich Zeit habe, lese ich.",b:rp("<b>wenn</b> = «когда (каждый раз), если». Глагол в придаточном — в конец. Если придаточное первое, главное начинается <b>с глагола</b>.")+rx(["<b>Wenn</b> es regnet, <b>bleiben</b> wir zu Hause.","Ich lerne, <b>wenn</b> die Kinder schlafen."]),tr:[["verbs","ord"]]},
  {t:"Модальные в Präteritum",ex:"Ich musste früh aufstehen.",b:rp("О прошлом модальные глаголы обычно в Präteritum: без умлаута + <b>-te</b>.")+tb2([["können","konnte"],["müssen","musste"],["wollen","wollte"],["dürfen","durfte"],["sollen","sollte"]])+rx(["Früher <b>musste</b> ich eine Uniform tragen."])}]},
 {n:5,t:"Am Arbeitsplatz",r:[
  {t:"Косвенные вопросы",ex:"Wissen Sie, wo der Drucker ist?",b:rp("Вежливо: <i>Wissen Sie / Können Sie mir sagen</i> + W-слово + … глагол <b>в конце</b>.")+rx(["Wo ist das Büro? → Können Sie mir sagen, wo das Büro <b>ist</b>?"])},
  {t:"Глагол wissen",ex:"Ich weiß es nicht.",b:tb2([["ich","weiß"],["du","weißt"],["er/sie","weiß"],["wir","wissen"],["ihr","wisst"],["sie/Sie","wissen"]])+rp("<b>wissen</b> — знать факт. <b>kennen</b> — быть знакомым с человеком, местом.")},
  {t:"Местоимения в Dativ (повторение)",ex:"Können Sie mir helfen?",b:CEXP.pron,tr:[["cases","pron"]]},
  {t:"dies-",ex:"dieser Drucker · diese Taste",b:rp("<b>dieser, diese, dieses</b> = «этот». Окончания как у der/die/das: dies<b>en</b> Ordner (Akk m), mit dies<b>em</b> Gerät.")},
  {t:"Вежливые просьбы: Könnten Sie …?",ex:"Könnten Sie mir helfen?",b:rp("Вежливее, чем <i>Können Sie</i>: <b>Könnten Sie / Könntest du</b> … + инфинитив в конце.")+rx(["Könnten Sie bitte das Fenster schließen?"]),tr:[["verbs","pol"]]}]},
 {n:6,t:"Wohnen nach Wunsch",r:[
  {t:"Глагол lassen",ex:"Ich lasse die Wohnung renovieren.",b:rp("<b>lassen</b> + инфинитив = «поручить, чтобы кто-то сделал». ich lasse, du lässt, er lässt.")+rx(["Ich renoviere selbst. ↔ Ich <b>lasse</b> renovieren."])},
  {t:"Возвратные глаголы",ex:"Ich freue mich. · Wir streiten uns.",b:vSheetFor("refl"),tr:[["verbs","refl"]]},
  {t:"legen / liegen, stellen / stehen",ex:"Ich lege das Buch auf den Tisch. → Es liegt auf dem Tisch.",b:tb2([["legen","Wohin? + Akk","liegen","Wo? + Dat"],["stellen","Wohin? + Akk","stehen","Wo? + Dat"],["hängen","Wohin? + Akk","hängen","Wo? + Dat"]],["действие","","результат",""])+rx(["Ich stelle die Lampe <b>in die</b> Ecke. → Sie steht <b>in der</b> Ecke."]),tr:[["cases","wowo"]]}]},
 {n:7,t:"Feste feiern",r:[
  {t:"Дата (повторение)",ex:"am 24. Dezember",b:rp("am + порядковое на <b>-ten / -sten</b>: am vierundzwanzig<b>sten</b> Dezember, am erst<b>en</b> Mai.")},
  {t:"Прилагательное после ein / kein",ex:"ein schöner Tag · eine schöne Feier",b:rp("После ein/kein/mein окончание прилагательного «показывает род», где артикль его не показал.")+tb2([["Nom","ein schön<b>er</b> Tag","eine schön<b>e</b> Feier","ein schön<b>es</b> Fest"],["Akk","einen schön<b>en</b> Tag","eine schön<b>e</b> Feier","ein schön<b>es</b> Fest"],["Dat","einem schön<b>en</b> Tag","einer schön<b>en</b> Feier","einem schön<b>en</b> Fest"]],["","m","f","n"])+rx(["Was für ein Kleid? — Ein lang<b>es</b> Kleid."]),tr:[["adj","i","Тренажёр окончаний"]]},
  {t:"Глаголы с Dativ и Akkusativ",ex:"Ich schenke meiner Mutter Blumen.",b:vSheetFor("gift"),tr:[["verbs","gift"]]}]},
 {n:8,t:"Neue Chancen",r:[
  {t:"Nebensätze mit damit",ex:"…, damit ich eine Arbeit finde.",b:vSheetFor("zweck"),tr:[["verbs","zweck"]]},
  {t:"Глаголы с предлогами (1)",ex:"sich interessieren für · teilnehmen an",b:vSheetFor("prep"),tr:[["verbs","prep"],["verbs","fu","freuen auf / über"]]}]},
 {n:9,t:"Gesund leben",r:[
  {t:"Советы: sollte + инфинитив",ex:"Du solltest mehr schlafen.",b:rp("<b>sollte</b> = «тебе стоило бы» — мягкий совет. ich sollte, du solltest, er sollte, wir sollten, Sie sollten.")+rx(["Sie <b>sollten</b> weniger Zucker <b>essen</b>."])}]},
 {n:10,t:"Arbeitssuche",r:[
  {t:"Желания: würde gern",ex:"Ich würde gern im Büro arbeiten.",b:rp("<b>würde gern</b> + инфинитив в конце = «я бы хотел». ich würde, du würdest, er würde, wir würden.")+rx(["Ich <b>würde gern</b> eine Ausbildung <b>machen</b>."])},
  {t:"Косвенные вопросы с ob",ex:"Ich möchte wissen, ob die Stelle frei ist.",b:rp("Вопрос без W-слова → <b>ob</b> («ли»). Глагол — в конец.")+rx(["Ist die Stelle noch frei? → Können Sie mir sagen, <b>ob</b> die Stelle noch frei <b>ist</b>?"])}]},
 {n:11,t:"Von Ort zu Ort",r:[

var DEV_V=null;

  try{if(!("speechSynthesis" in window))return null;if(DEV_V&&DEV_V.lang)return DEV_V;
    var vs=window.speechSynthesis.getVoices().filter(function(v){return /^de([-_]|$)/i.test(v.lang);});if(!vs.length)return null;
    vs.sort(function(a,b){function sc(v){return (/natural|online|neural/i.test(v.name)?4:0)+(/google/i.test(v.name)?3:0)+(/de[-_]DE/i.test(v.lang)?2:0)+(v.localService?0:1);}return sc(b)-sc(a);});
    DEV_V=vs[0];return DEV_V;}catch(e){return null;}
}

  var p=document.getElementById("vpanel"),b=document.getElementById("vtoggle");if(!p||!b||p.hidden)return;
  var r=b.getBoundingClientRect(),vw=document.documentElement.clientWidth,w=Math.min(300,vw-32);
  p.style.width=w+"px";p.style.top=(r.bottom+8)+"px";p.style.left=Math.max(16,Math.min(r.left,vw-16-w))+"px";
}
window.addEventListener("resize",vPlace);window.addEventListener("scroll",vPlace,{passive:true});
function vDiag(){var all=[],de=[];try{all=window.speechSynthesis?window.speechSynthesis.getVoices():[];de=all.filter(function(v){return /^de/i.test(v.lang);});}catch(e){}
  var dv=deVoice();return '<p class="muted" style="margin:0;font-size:.8rem">Голосов в браузере: '+all.length+', немецких: '+de.length+(dv?" · сейчас: "+esc(dv.name):"")+(window.speechSynthesis?"":" · синтез речи недоступен")+"</p>";}
function vToggleAll(){var v=vset();v.on=v.on===false;save();if(v.on===false){try{window.speechSynthesis.cancel();}catch(e){}try{if(ttsNs)ttsNs.stop();}catch(e){}}vRender();
  var t=document.getElementById("vtoggle");if(t)t.focus();}
document.addEventListener("click",function(e){
  var s=e.target.closest('[data-act="v-say"]');if(s){e.preventDefault();sayText(s.getAttribute("data-t"));return;}
  var tg=e.target.closest("#vtoggle");if(tg){var p=document.getElementById("vpanel");if(p.hidden){vRender();p=document.getElementById("vpanel");tg=document.getElementById("vtoggle");p.hidden=false;}else p.hidden=true;tg.setAttribute("aria-expanded",String(!p.hidden));if(!p.hidden)vPlace();return;}
  var pl=e.target.closest('[data-act="pl"]');if(pl&&R&&R.P&&vOn("show")){var w=R.P.left[+pl.getAttribute("data-i")];if(w)speak(w);}
  var pnl=document.getElementById("vpanel");if(pnl&&!pnl.hidden&&!e.target.closest("#vbox")){pnl.hidden=true;var t2=document.getElementById("vtoggle");if(t2)t2.setAttribute("aria-expanded","false");}
});
document.addEventListener("change",function(e){
  var c=e.target.closest("#vpanel input");if(!c)return;var k=c.getAttribute("data-v"),v=vset();
  if(k==="on"){vToggleAll();var p=document.getElementById("vpanel");if(p){p.hidden=false;vPlace();}return;}
  v[k]=c.checked;save();
});
document.addEventListener("keydown",function(e){
  if((e.key==="m"||e.key==="M"||e.key==="ь"||e.key==="Ь")&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.target.tagName!=="INPUT"&&e.target.tagName!=="TEXTAREA"){e.preventDefault();vToggleAll();}
});
vRender();

renderHome();
initCloud();
})();
